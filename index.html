<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Lust — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    html, body {
      overflow-x: hidden;
    }

    body {
      background: #000;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      padding: 1.5rem;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: #000 url("teaser.jpg") center / cover no-repeat;
      z-index: -1;
      animation: slowzoom 40s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes slowzoom {
      from { transform: scale(1); }
      to   { transform: scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg { animation: none; }
    }

    .logo {
      display: block;
      width: min(80vw, 560px);
      height: auto;
    }

    .coming-soon {
      margin-top: 4rem;
      color: #fff;
      font-family: 'Montserrat', -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-size: 1.2rem;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.36em;
      text-indent: 0.36em;
      text-align: center;
    }

    .copyright { position: fixed; bottom: max(1.2rem, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); color: #fff; font-size: 0.7rem; letter-spacing: 0.08em; text-align: center; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="hero">
    <img class="logo" src="logo.png" alt="Dark Lust — World of Pleasure">
    <p class="coming-soon">Coming Soon</p>
  </main>
  <footer class="copyright">© 2026 DARK LUST. All rights reserved.</footer>
</body>
</html>
